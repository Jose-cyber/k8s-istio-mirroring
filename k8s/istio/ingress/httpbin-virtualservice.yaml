apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: httpbin1
spec:
  hosts:
    - "*"
  gateways:
    - istio-ingress/httpbin-gateway
  http:
    - route:
        - destination:
            host: httpbin.httpbin1.svc.cluster.local
            port:
              number: 8000
          weight: 100

      mirrors:
        - destination:
            host: httpbin.httpbin2.svc.cluster.local
            port:
              number: 8000
          percentage:
            value: 100.0