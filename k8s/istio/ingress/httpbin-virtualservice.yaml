apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: httpbin1
spec:
  hosts:
    - "*"
  gateways:
    - istio-ingress/httpbin-gateway
  http:
    - route:
        - destination:
            host: httpbin.httpbin1.svc.cluster.local
            port:
              number: 8000
